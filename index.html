<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webaju | Criação de Websites</title>
<meta name="description" content="A Webaju está preparando um novo site. Em breve, no ar. Enquanto isso, fale com a gente.">
<meta name="theme-color" content="#14507c">
<link rel="icon" href="logo.jpg">
<style>
  :root {
    --azul: #14507c;
    --verde: #1b8a60;
    --texto: #1e2a33;
    --suave: #56636d;
    --linha: #dbe6e9;
    --fundo: #ffffff;
    --grad: linear-gradient(100deg, var(--azul), var(--verde));
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }
  main { width: 100%; max-width: 560px; }
  .logo {
    width: min(380px, 80%);
    height: auto;
    mix-blend-mode: multiply;
    margin-bottom: 8px;
  }
  /* Momento principal: chaves do logo envolvendo a mensagem */
  .aviso {
    position: relative;
    display: inline-block;
    padding: 6px 34px;
    margin: 8px 0 24px;
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: var(--azul);
  }
  .aviso::before, .aviso::after {
    position: absolute;
    top: 50%;
    transform: translateY(-52%);
    font-size: 2.6em;
    font-weight: 300;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .aviso::before { content: "{"; left: 0; }
  .aviso::after  { content: "}"; right: 0; }
  p { color: var(--suave); font-size: 1.05rem; max-width: 46ch; margin: 0 auto 32px; }
  .botao {
    display: inline-block;
    background: var(--grad);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 30px;
    border-radius: 999px;
  }
  .botao:hover { filter: brightness(1.08); }
  .botao:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
  footer { margin-top: 48px; font-size: .85rem; color: var(--suave); }
  .cursor {
    display: inline-block; width: .08em; height: .9em; margin-left: .15em;
    background: var(--verde); vertical-align: -.1em;
    animation: piscar 1.1s steps(1) infinite;
  }
  @keyframes piscar { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpg" alt="Webaju - Criação de Websites" width="1500" height="703">
    <h1 class="aviso">Site em construção<span class="cursor" aria-hidden="true"></span></h1>
    <p>Estamos preparando algo novo para você. Enquanto isso, se precisar de um site para o seu negócio, é só chamar.</p>
    <a class="botao" href="https://wa.me/5579988313900?text=Ol%C3%A1%21%20Vim%20pelo%20site%20da%20Webaju%20e%20gostaria%20de%20saber%20mais." target="_blank" rel="noopener">Chamar no WhatsApp</a>
  </main>
  <footer>&copy; <span id="ano">2026</span> Webaju</footer>
  <script>document.getElementById("ano").textContent = new Date().getFullYear();</script>
</body>
</html>
